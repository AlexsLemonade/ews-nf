name: Check nextflow stub

on:
  pull_request:
    branches:
      - main

jobs:
  nf-config-check:
    name: Check nextflow configuration
    runs-on: ubuntu-latest
    container: nfcore/tools:3.2.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Nextflow params
        run: nextflow config

      - name: Check nextflow_schema.json file
        if: ${{ !cancelled() }}
        run: nf-core pipelines schema lint
        
  nf-stub-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Nextflow
        uses: nf-core/setup-nextflow@v2
        with: 
          version: '25.10.4'

      - name: Check Nextflow workflow with reference building
        run: nextflow -log stub-run.log run main.nf --workflow reference -stub -profile stub -ansi-log false

      - name: Check Nextflow workflow for main annotation
        run: nextflow -log stub-run.log run main.nf --workflow -profile stub -ansi-log false

      - name: Check Nextflow workflow for nmf metaprograms
        run: nextflow -log stub-run.log run main.nf --workflow nmf_metaprograms -stub -profile stub -ansi-log false

      - name: Check Nextflow workflow for nmf metaprograms with subset mode 
        run: nextflow -log stub-run.log run main.nf --workflow nmf_metaprograms -stub -profile stub -ansi-log false --subset_mode

      - name: Upload nextflow log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-log
          path: stub-run.log
